<section class="page-title">
    <h2>GÓP Ý</h2>
    <p>Ý kiến của bạn giúp YING DRINK tốt hơn</p>
</section>

<section class="container">
    <form class="feedback-form">
        <label for="name">Họ và tên</label>
        <input type="text" id="name" placeholder="Nhập họ và tên" required>

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Nhập email" required>

        <label for="subject">Chủ đề</label>
        <input type="text" id="subject" placeholder="Nhập chủ đề" required>

        <label for="message">Nội dung góp ý</label>
        <textarea id="message" rows="6" placeholder="Nhập nội dung góp ý" required></textarea>

        <button type="submit">GỬI GÓP Ý</button>
    </form>
</section>
