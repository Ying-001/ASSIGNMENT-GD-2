<section class="auth-container">
    <div class="auth-box">
        <h2>ĐĂNG KÝ</h2>
        <p>Tạo tài khoản YING DRINK</p>

        <form id="registerForm">
            <label for="registerName">Họ và tên</label>
            <input type="text" id="registerName" placeholder="Nhập họ và tên" required>

            <label for="registerEmail">Email</label>
            <input type="email" id="registerEmail" placeholder="Nhập email" required>

            <label for="registerPassword">Mật khẩu</label>
            <input type="password" id="registerPassword" placeholder="Ít nhất 6 ký tự" required>

            <label for="registerConfirm">Nhập lại mật khẩu</label>
            <input type="password" id="registerConfirm" placeholder="Nhập lại mật khẩu" required>

            <button type="submit">ĐĂNG KÝ</button>
        </form>

        <p class="auth-link">Đã có tài khoản? <a href="dang-nhap.html">Đăng nhập</a></p>
        <p id="registerMessage" class="form-message"></p>
    </div>
</section>
